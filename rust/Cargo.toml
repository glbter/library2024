[workspace]
resolver = "2"
members = ["crates/comments-service"]

[workspace.package]
version = "0.0.1"
edition = "2021"

[workspace.dependencies]
askama = { version = "0.12", features = ["with-axum", "serde-json"] }
askama_axum = { version = "0.4", features = ["serde-json"] }
axum = "0.7"
axum-extra = "0.9"
axum-htmx = "0.6"
clap = "4.5"
color-eyre = "0.6"
itertools = "0.13"
serde = "1.0"
sqlx = "0.8"
thiserror = "2.0"
tokio = "1.40"
tracing = "0.1"
tracing-subscriber = "0.3"
pretty_assertions = "1.4"